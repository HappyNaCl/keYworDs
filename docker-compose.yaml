services:
  mysql:
    image: mysql:8.0
    container_name: keywords-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: keywords
      MYSQL_DATABASE: keywords
      MYSQL_USER: keywords
      MYSQL_PASSWORD: keywords
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: